<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard</title><link rel="stylesheet" href="style.css"></head><body><main class="container admin"><section id="loginView" class="card login"><h1>Admin Login</h1><form id="loginForm"><label>Username<input name="username" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><p id="loginError" class="error"></p><button class="btn primary wide">Login</button><p class="fine-print" style="margin-top:10px;text-align:center;">লগইন তথ্য: admin / admin123</p></form></section><section id="dashboard" hidden><div class="admin-head"><h1>Order Dashboard</h1><button id="logout" class="btn secondary">Logout</button></div><div id="stats" class="stats"></div><div class="toolbar"><input id="search" placeholder="Order ID, নাম বা ফোন দিয়ে খুঁজুন"><select id="statusFilter"><option value="">সব স্ট্যাটাস</option><option>Pending</option><option>Confirmed</option><option>Processing</option><option>Shipped</option><option>Delivered</option><option>Cancelled</option><option>Returned</option></select><button id="export" class="btn secondary">Export CSV</button></div><div class="table-wrap"><table><thead><tr><th>Order ID</th><th>Date</th><th>Customer</th><th>Phone</th><th>Total</th><th>Status</th><th>Action</th></tr></thead><tbody id="ordersBody"></tbody></table></div></section></main><div id="detailModal" class="modal" hidden><div class="modal-box"><button class="modal-close" id="closeDetail">×</button><div id="detail"></div></div></div><script src="admin.js"></script></body></html>
