<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow3" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bgGlow3)"/>

  <!-- Luxury Presentation Box -->
  <g filter="url(#shadow3)">
    <rect x="80" y="120" width="440" height="360" rx="20" fill="url(#boxGrad)" stroke="#334155" stroke-width="3"/>
    <rect x="95" y="135" width="410" height="330" rx="14" fill="#090d16" stroke="#0f766e" stroke-width="2"/>

    <!-- Inside cushion compartments -->
    <!-- Watch compartment -->
    <rect x="120" y="160" width="220" height="280" rx="14" fill="#0f172a"/>
    <rect x="155" y="210" width="150" height="180" rx="24" fill="#1e293b" stroke="#334155"/>
    <text x="230" y="305" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#2dd4bf" text-anchor="middle">প্রিমিয়াম প্যাকেজিং</text>

    <!-- Charger & Manual compartment -->
    <rect x="360" y="160" width="120" height="130" rx="12" fill="#0f172a"/>
    <!-- Magnetic puck -->
    <circle cx="420" cy="225" r="30" fill="#334155" stroke="#475569" stroke-width="3"/>
    <circle cx="420" cy="225" r="14" fill="#0f766e"/>
    <path d="M 420,255 C 420,275 435,280 445,280" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>

    <!-- User Guide / Warranty Card -->
    <rect x="360" y="310" width="120" height="130" rx="12" fill="#0f172a"/>
    <rect x="375" y="330" width="90" height="90" rx="6" fill="#1e293b" stroke="#475569"/>
    <text x="420" y="375" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">ওয়ারেন্টি কার্ড</text>
    <text x="420" y="395" font-family="system-ui, sans-serif" font-size="10" fill="#0d9488" text-anchor="middle">✓ ১ বছর</text>
  </g>

  <!-- Complete set badge -->
  <g transform="translate(200, 510)">
    <rect width="200" height="42" rx="8" fill="#0f766e"/>
    <text x="100" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">ফুল বক্স কমপ্লিট সেট</text>
  </g>
</svg>
